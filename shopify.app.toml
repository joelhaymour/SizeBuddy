client_id = "2f04ec2176fa381f9554da22c41aebb0"
application_url = "https://sizebuddy.onrender.com"
embedded = true
name = "size-buddy"
handle = "size-buddy-v6-testing"

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-01"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://sizebuddy.onrender.com/api/webhooks"

[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "https://sizebuddy.onrender.com/api/webhooks"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products read_products write_customers read_customers read_themes write_themes read_orders"

[auth]
redirect_urls = [
      "https://sizebuddy.onrender.com/api/auth/callback",
      "https://sizebuddy.onrender.com/api/auth/exit-iframe"
]

[pos]
embedded = false

[app_proxy]
  url = "https://sizebuddy.onrender.com"
prefix = "apps"
subpath = "size-buddy"
